name: Update live scores

on:
  # Every 5 minutes so live scores lag real play by at most ~5 min plus a
  # deploy. Cheap to run this often: the script checks kickoff windows
  # against the already-cached fixture list and exits without any API call
  # (or commit) unless a match could actually be live right now, and
  # deploy.yml skips its build entirely when a run pushed nothing.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      backfill_match_id:
        description: >
          Optional: force-fetch match stats for this football-data.org match
          id from data.json's lastResults, bypassing the normal
          just-finished-transition detection. Useful for a match that
          finished before this feature existed, or whose stats fetch failed
          and needs a retry.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: live-scores
  cancel-in-progress: false

jobs:
  update-live-scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch live scores
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MATCH_STATS_BACKFILL_ID: ${{ github.event.inputs.backfill_match_id }}
        run: npm run fetch-live-scores

      - name: Commit changed files
        run: |
          # live-scores.json always exists after a run, but data.json is only
          # touched when a match just finished, and match-stats.json may not
          # exist yet on its very first-ever write - `git add` each
          # conditionally so a plain `git diff` (which ignores untracked
          # files) doesn't miss a brand-new one.
          for f in public/live-scores.json public/data.json public/match-stats.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update live scores"
          # main moves often (update.yml/lineups.yml/odds.yml can push too),
          # so a plain push here can lose the race and get rejected as
          # non-fast-forward - rebase onto whatever's new and retry instead
          # of discarding this run's fetched data.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching and rebasing..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push after retries"
          exit 1
