name: Update Kalshi odds

on:
  # Kalshi prices move continuously while a market is open, so this runs
  # fairly often. No API key needed - Kalshi's market data is fully public.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: odds
  cancel-in-progress: false

jobs:
  update-odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch Kalshi odds
        run: npm run fetch-odds

      - name: Commit odds.json if changed
        run: |
          if git diff --quiet -- public/odds.json; then
            echo "No changes to public/odds.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/odds.json
          git commit -m "chore: update Kalshi odds"
          # main moves often (update.yml/lineups.yml can push too), so a
          # plain push here can lose the race and get rejected as non-fast-
          # forward - rebase onto whatever's new and retry instead of
          # discarding this run's fetched data.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching and rebasing..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push after retries"
          exit 1
