name: Update Kalshi odds

on:
  # Kalshi prices move continuously while a market is open, so this runs
  # fairly often. No API key needed - Kalshi's market data is fully public.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: odds
  cancel-in-progress: false

jobs:
  update-odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch Kalshi odds
        run: npm run fetch-odds

      - name: Commit odds.json if changed
        run: |
          if git diff --quiet -- public/odds.json; then
            echo "No changes to public/odds.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/odds.json
          git commit -m "chore: update Kalshi odds"
          git push
