name: Update last-season history

on:
  # Last season's numbers never change once the season is over, so this
  # only needs to run occasionally - not on the frequent update/lineups
  # schedules. Runs monthly to catch a season rollover automatically, plus
  # manual dispatch for testing or an immediate refresh.
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch last-season history
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: npm run fetch-history

      - name: Commit history.json if changed
        run: |
          if git diff --quiet -- public/history.json; then
            echo "No changes to public/history.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/history.json
          git commit -m "chore: update last-season history"
          # main moves often (update.yml/lineups.yml/odds.yml can push too),
          # so a plain push here can lose the race and get rejected as non-
          # fast-forward - rebase onto whatever's new and retry instead of
          # discarding this run's fetched data.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching and rebasing..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push after retries"
          exit 1
