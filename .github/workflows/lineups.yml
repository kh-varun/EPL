name: Update confirmed lineups

on:
  # Official team sheets appear ~20-40 min before kickoff, so poll often.
  # The script exits without spending API quota unless a match is imminent.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lineups
  cancel-in-progress: false

jobs:
  update-lineups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch confirmed lineups
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: npm run fetch-lineups

      - name: Commit lineups.json if changed
        run: |
          if git diff --quiet -- public/lineups.json; then
            echo "No changes to public/lineups.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/lineups.json
          git commit -m "chore: update confirmed lineups"
          git push
