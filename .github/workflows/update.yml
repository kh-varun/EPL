name: Update PL data

on:
  schedule:
    # Wednesdays 06:00 America/Los_Angeles.
    # PT is UTC-8 (PST) most of the year and UTC-7 (PDT) in summer;
    # cron below covers PDT (13:00 UTC) since it's the common case in-season.
    - cron: "0 13 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch latest PL data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: npm run fetch-data

      - name: Commit data if changed
        run: |
          # api-football-team-ids.json is a cache that's only written when it
          # changes (see fetch.mjs) and may not exist at all without an
          # API_FOOTBALL_KEY - `git add` it conditionally so a plain
          # `git diff` (which ignores untracked files) doesn't miss it, and
          # so this step doesn't fail when there's nothing new to stage.
          git add public/data.json
          if [ -f public/api-football-team-ids.json ]; then
            git add public/api-football-team-ids.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update PL data"
          # main moves often (lineups.yml/odds.yml poll every 15 min), so a
          # plain push here can lose the race and get rejected as non-fast-
          # forward - rebase onto whatever's new and retry instead of
          # discarding this run's fetched data.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching and rebasing..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push after retries"
          exit 1
