name: Update PL data

on:
  schedule:
    # Wednesdays 06:00 America/Los_Angeles.
    # PT is UTC-8 (PST) most of the year and UTC-7 (PDT) in summer;
    # cron below covers PDT (13:00 UTC) since it's the common case in-season.
    - cron: "0 13 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch latest PL data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: npm run fetch-data

      - name: Commit data.json if changed
        run: |
          if git diff --quiet -- public/data.json; then
            echo "No changes to public/data.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git commit -m "chore: update PL data"
          git push
