name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # A push made with the default GITHUB_TOKEN - which is how every
  # scheduled fetch workflow (update.yml, lineups.yml, odds.yml,
  # history.yml, live-scores.yml) commits its data - does NOT fire this
  # workflow's `on: push` trigger (a deliberate GitHub restriction to
  # avoid infinite workflow loops). Without this, only a PR-merge push
  # ever redeploys the site, so any fresh JSON those workflows commit
  # sits unreachable on main until the next PR happens to land -
  # confirmed live: every prior "Deploy to GitHub Pages" run lined up
  # with a PR merge, never with a `chore: update ...` bot commit.
  # `workflow_run` doesn't have that restriction, since it listens for
  # the upstream workflow's completion rather than re-triggering off its
  # push - use it to redeploy after each of those five finishes.
  workflow_run:
    workflows:
      - "Update PL data"
      - "Update confirmed lineups"
      - "Update Kalshi odds"
      - "Update last-season history"
      - "Update live scores"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress must stay false: with the precheck below, a no-op
# fetch run's deploy skips at the precheck, so if it instead CANCELLED an
# in-flight build of a real change, that change would never deploy - the
# skip logic would then see main unchanged on every later no-op run and
# keep skipping, leaving the site frozen at the old content (the exact
# failure mode this repo already lived through once, see CLAUDE.md).
# Queued-run collapse still keeps bursts from piling up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Every completed fetch workflow triggers this deploy, but most of those
  # runs commit nothing (live-scores.yml alone completes ~288 no-op runs a
  # day when no match is on) - skip the full build/deploy for those. If the
  # triggering run pushed a commit, main's HEAD no longer equals the SHA
  # that run started from; if HEAD still equals it, nothing new has landed
  # since the site was last built from this very commit. Deliberately
  # fail-open: the step only runs for workflow_run events, so push/dispatch
  # deploys always build, and an empty/absent output also builds.
  precheck:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: compare
        if: github.event_name == 'workflow_run'
        run: |
          if [ "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "Triggering run pushed nothing and main hasn't moved - skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: precheck
    if: >-
      needs.precheck.outputs.skip != 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
